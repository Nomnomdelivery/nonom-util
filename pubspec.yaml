description: "A new Flutter package project."
version: 0.0.1

environment:
  sdk: ^3.10.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  cloud_firestore: ^5.6.8
  gap: ^3.0.1
  fluttertoast: ^8.2.12
