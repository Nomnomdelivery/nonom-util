  intl: ^0.20.2
  flutter_animate: ^4.5.2
  toastification: ^3.0.3
  flutter_slidable: ^4.0.0
  google_maps_flutter: ^2.12.2
  image: ^4.8.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

